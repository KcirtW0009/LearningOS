nodes:
- id: image-basics
  title: 图像基本概念
  description: 像素、颜色空间（RGB、HSV）、图像通道、图像分辨率和位深。
  type: concept
  difficulty: beginner
  resources:
  - type: url
    uri: https://docs.opencv.org/4.x/df/d9d/tutorial_py_colorspaces.html
    label: OpenCV颜色空间转换
  - type: url
    uri: https://www.imageprocessingplace.com/downloads_V3/root_downloads/tutorials/color_spaces.pdf
    label: 颜色空间基础（PDF）
- id: image-preprocessing
  title: 图像预处理
  description: 缩放、归一化（减均值除标准差）、数据增强（翻转、旋转、裁剪、颜色抖动）等。
  type: concept
  difficulty: beginner
  resources:
  - type: url
    uri: https://pytorch.org/vision/stable/transforms.html
    label: PyTorch transforms 官方文档
  - type: url
    uri: https://albumentations.ai/docs/examples/
    label: Albumentations 增强示例
- id: nn-basics
  title: 神经网络基本结构
  description: 神经元、全连接层、前向传播、计算图的基本概念。
  type: concept
  difficulty: beginner
  resources:
  - type: url
    uri: https://cs231n.github.io/neural-networks-1/
    label: CS231n 神经网络笔记
- id: backpropagation
  title: 反向传播算法
  description: 链式法则、梯度计算、权重更新机制。
  type: concept
  difficulty: beginner
  resources:
  - type: url
    uri: https://cs231n.github.io/optimization-2/
    label: CS231n 反向传播与梯度
- id: activation-functions
  title: 常见激活函数
  description: ReLU、Sigmoid、Tanh、Leaky ReLU、Mish、Swish 等及其优缺点。
  type: concept
  difficulty: beginner
  resources:
  - type: url
    uri: https://towardsdatascience.com/activation-functions-neural-networks-1cbd9f8d91d6
    label: 激活函数综述
  - type: url
    uri: https://arxiv.org/abs/1908.08681
    label: Mish 论文
- id: loss-functions
  title: 常见损失函数
  description: 均方误差（MSE）、交叉熵、二元交叉熵、CIoU 损失等。
  type: concept
  difficulty: beginner
  resources:
  - type: url
    uri: https://pytorch.org/docs/stable/nn.html#loss-functions
    label: PyTorch 损失函数文档
  - type: url
    uri: https://arxiv.org/abs/1911.08287
    label: CIoU 损失论文
- id: optimizers
  title: 优化器与学习率调度
  description: SGD、Adam、AdamW，以及余弦退火、阶梯下降等学习率策略。
  type: concept
  difficulty: beginner
  resources:
  - type: url
    uri: https://cs231n.github.io/neural-networks-3/#sgd
    label: CS231n 优化器笔记
  - type: url
    uri: https://pytorch.org/docs/stable/optim.html
    label: PyTorch 优化器文档
- id: convolution-operation
  title: 卷积操作
  description: 卷积核、步长（stride）、填充（padding）、特征图尺寸计算，以及分组卷积、空洞卷积等变体。
  type: concept
  difficulty: intermediate
  resources:
  - type: url
    uri: https://cs231n.github.io/convolutional-networks/#conv
    label: CS231n 卷积层详解
  - type: url
    uri: https://arxiv.org/abs/1603.07285
    label: 空洞卷积论文
- id: pooling-operation
  title: 池化操作
  description: 最大池化、平均池化，池化的作用（降维、平移不变性）及全局池化。
  type: concept
  difficulty: intermediate
  resources:
  - type: url
    uri: https://cs231n.github.io/convolutional-networks/#pool
    label: CS231n 池化层
- id: classic-cnn
  title: 经典CNN架构
  description: AlexNet、VGG、ResNet（残差结构）、Inception 等，重点理解残差连接和深度可分离卷积。
  type: concept
  difficulty: intermediate
  resources:
  - type: url
    uri: https://arxiv.org/abs/1512.03385
    label: ResNet 论文
  - type: url
    uri: https://www.cv-foundation.org/openaccess/content_cvpr_2015/papers/He_Deep_Residual_Learning_2015_CVPR_paper.pdf
    label: ResNet CVPR 版本
- id: object-detection-task
  title: 目标检测任务定义
  description: 目标检测 vs 图像分类 vs 语义分割，应用场景（自动驾驶、安防、医疗）及评估挑战。
  type: concept
  difficulty: intermediate
  resources:
  - type: url
    uri: https://www.robots.ox.ac.uk/~vgg/blog/object-detection.html
    label: VGG 目标检测概述
- id: two-stage-detectors
  title: 两阶段检测器（R-CNN系列）
  description: R-CNN、Fast R-CNN、Faster R-CNN 的原理，候选区域生成（Selective Search, RPN）和 ROI
    池化。
  type: concept
  difficulty: intermediate
  resources:
  - type: url
    uri: https://arxiv.org/abs/1311.2524
    label: R-CNN 论文
  - type: url
    uri: https://arxiv.org/abs/1506.01497
    label: Faster R-CNN 论文
- id: one-stage-detectors
  title: 单阶段检测器概念
  description: YOLO、SSD、RetinaNet 的核心思想，密度分布与锚框设计，速度与精度的权衡。
  type: concept
  difficulty: intermediate
  resources:
  - type: url
    uri: https://arxiv.org/abs/1512.02325
    label: SSD 论文
  - type: url
    uri: https://arxiv.org/abs/1708.02002
    label: RetinaNet 论文（Focal Loss）
- id: iou-metric
  title: IoU 计算与理解
  description: 交并比（Intersection over Union）的定义、计算方法及在检测中的作用。
  type: concept
  difficulty: intermediate
  resources:
  - type: url
    uri: https://www.pyimagesearch.com/2016/11/07/intersection-over-union-iou-for-object-detection/
    label: IoU 实战教程
- id: map-metric
  title: mAP 评估指标详解
  description: 精确率（Precision）、召回率（Recall）、AP（平均精度）的计算，COCO mAP 的多种 IoU 阈值。
  type: concept
  difficulty: intermediate
  resources:
  - type: url
    uri: https://cocodataset.org/#detection-eval
    label: COCO 官方评估说明
  - type: url
    uri: https://towardsdatascience.com/mean-average-precision-for-object-detection-45c7fc8b6b66
    label: mAP 详解（含代码）
- id: yolo-v1-grid
  title: YOLOv1 – 网格划分与边界框回归
  description: 将图像划分为 S×S 网格，每个网格预测 B 个边界框及置信度，同时预测类别概率。
  type: concept
  difficulty: intermediate
  resources:
  - type: url
    uri: https://arxiv.org/abs/1506.02640
    label: YOLOv1 原始论文
  - type: url
    uri: https://pjreddie.com/media/files/papers/yolo_1.pdf
    label: YOLOv1 PDF
- id: yolo-v1-loss
  title: YOLOv1 – 损失函数设计
  description: 坐标误差、置信度误差和分类误差，以及定位损失加权策略。
  type: concept
  difficulty: intermediate
  resources:
  - type: url
    uri: https://medium.com/@jonathan_hui/real-time-object-detection-with-yolo-yolov2-28b1b93e2088
    label: YOLO 损失函数解读
- id: yolo-v2-anchors
  title: YOLOv2 – 锚框与批量归一化
  description: 引入锚框（anchor boxes）替代全连接，使用聚类确定先验框尺寸；添加批量归一化提升收敛。
  type: concept
  difficulty: intermediate
  resources:
  - type: url
    uri: https://arxiv.org/abs/1612.08242
    label: YOLOv2 论文（YOLO9000）
  - type: url
    uri: https://pjreddie.com/darknet/yolo9000/
    label: YOLO9000 官方页
- id: yolo-v3-multiscale
  title: YOLOv3 – 多尺度预测与Darknet-53
  description: 特征金字塔（FPN）思想，三个不同尺度的输出，Darknet-53 骨干网络及残差连接。
  type: concept
  difficulty: intermediate
  resources:
  - type: url
    uri: https://arxiv.org/abs/1804.02767
    label: YOLOv3 论文
  - type: url
    uri: https://pjreddie.com/darknet/yolo/
    label: Darknet 主页
- id: yolo-v4-csp
  title: YOLOv4 – CSPDarknet与Mish
  description: 跨阶段局部连接（CSPNet）、Mish 激活函数、SAM 注意力、PANet 路径聚合。
  type: concept
  difficulty: advanced
  resources:
  - type: url
    uri: https://arxiv.org/abs/2004.10934
    label: YOLOv4 论文
  - type: url
    uri: https://github.com/AlexeyAB/darknet
    label: YOLOv4 官方代码（Darknet）
- id: yolo-v4-aug-loss
  title: YOLOv4 – CIoU损失与Mosaic增强
  description: CIoU 损失函数与 Mosaic 数据增强，以及自对抗训练（SAT）等技巧。
  type: concept
  difficulty: advanced
  resources:
  - type: url
    uri: https://arxiv.org/abs/1911.08287
    label: CIoU 损失论文
  - type: url
    uri: https://blog.roboflow.com/yolo-v4-data-augmentation/
    label: Mosaic 增强解读
- id: yolo-v5-impl
  title: YOLOv5 – PyTorch实现与工程技巧
  description: Ultralytics 的 PyTorch 实现，Focus 层、自适应锚框、自动混合精度训练及超参数进化。
  type: concept
  difficulty: advanced
  resources:
  - type: url
    uri: https://github.com/ultralytics/yolov5
    label: YOLOv5 GitHub
  - type: url
    uri: https://docs.ultralytics.com/
    label: YOLOv5 官方文档
- id: yolo-v6-repvgg
  title: YOLOv6 – RepVGG结构
  description: 基于 RepVGG 的骨干网络，训练时多分支、推理时重参数化，提高速度。
  type: concept
  difficulty: advanced
  resources:
  - type: url
    uri: https://arxiv.org/abs/2209.02976
    label: YOLOv6 论文
  - type: url
    uri: https://github.com/meituan/YOLOv6
    label: YOLOv6 GitHub
- id: yolo-v7-elan
  title: YOLOv7 – E-ELAN架构
  description: 扩展高效层聚合网络（E-ELAN），辅助训练头（auxiliary heads）及模型重参数化。
  type: concept
  difficulty: advanced
  resources:
  - type: url
    uri: https://arxiv.org/abs/2207.02696
    label: YOLOv7 论文
  - type: url
    uri: https://github.com/WongKinYiu/yolov7
    label: YOLOv7 GitHub
- id: yolo-v8-anchorfree
  title: YOLOv8 – 无锚框与C2f模块
  description: 摒弃锚框（anchor-free），采用解耦头（decoupled head）和 C2f（跨阶段部分连接 + 更多分支）结构，支持旋转框等新特性。
  type: concept
  difficulty: advanced
  resources:
  - type: url
    uri: https://github.com/ultralytics/ultralytics
    label: YOLOv8 GitHub（Ultralytics）
  - type: url
    uri: https://docs.ultralytics.com/
    label: YOLOv8 官方文档
- id: dataset-preparation
  title: 数据集准备与格式转换
  description: COCO、VOC 等标准格式，数据划分（train/val/test），以及将自定义标注转换为YOLO格式。
  type: skill
  difficulty: intermediate
  resources:
  - type: url
    uri: https://docs.ultralytics.com/datasets/
    label: Ultralytics 数据集指南
  - type: url
    uri: https://roboflow.com/formats/yolo
    label: YOLO格式说明（Roboflow）
- id: labeling-tools
  title: 标注工具与技巧
  description: LabelImg、CVAT、Roboflow 等工具的使用，标注质量对模型的影响。
  type: skill
  difficulty: intermediate
  resources:
  - type: url
    uri: https://github.com/tzutalin/labelImg
    label: LabelImg GitHub
  - type: url
    uri: https://cvat.org/
    label: CVAT 官网
- id: training-config
  title: 训练配置文件修改
  description: 修改数据集路径、类别数、超参数（学习率、批次大小）、数据增强策略等。
  type: skill
  difficulty: intermediate
  resources:
  - type: url
    uri: https://docs.ultralytics.com/usage/cfg/
    label: Ultralytics 配置说明
- id: hyperparameter-tuning
  title: 超参数调优
  description: 学习率调整、动量、权重衰减、批次大小选择，以及自动超参数搜索（如遗传算法）。
  type: skill
  difficulty: advanced
  resources:
  - type: url
    uri: https://docs.ultralytics.com/usage/hyperparameter-tuning/
    label: YOLOv8 超参数调优文档
  - type: url
    uri: https://arxiv.org/abs/2006.02596
    label: 超参数调优综述
- id: training-monitoring
  title: 训练过程监控与可视化
  description: 损失曲线、mAP曲线、混淆矩阵、PR曲线等，使用TensorBoard或Weights & Biases。
  type: skill
  difficulty: intermediate
  resources:
  - type: url
    uri: https://docs.ultralytics.com/usage/results/
    label: Ultralytics 结果可视化
  - type: url
    uri: https://wandb.ai/site
    label: Weights & Biases 主页
- id: model-export
  title: 模型导出（ONNX / TorchScript）
  description: 将 PyTorch 模型导出为 ONNX、TorchScript 格式，以便于跨平台推理。
  type: skill
  difficulty: advanced
  resources:
  - type: url
    uri: https://onnxruntime.ai/
    label: ONNX Runtime 主页
  - type: url
    uri: https://pytorch.org/docs/stable/jit.html
    label: PyTorch JIT 文档
- id: tensorrt-optimization
  title: TensorRT 加速优化
  description: 使用 NVIDIA TensorRT 对模型进行 FP16 / INT8 量化、层融合和内核自动调优。
  type: skill
  difficulty: advanced
  resources:
  - type: url
    uri: https://developer.nvidia.com/tensorrt
    label: NVIDIA TensorRT 官方页
  - type: url
    uri: https://docs.ultralytics.com/integrations/tensorrt/
    label: YOLOv8 TensorRT 集成指南
- id: edge-deployment
  title: 边缘设备部署
  description: 在 NVIDIA Jetson、树莓派、手机等设备上部署 YOLO，考虑内存和功耗限制。
  type: skill
  difficulty: advanced
  resources:
  - type: url
    uri: https://developer.nvidia.com/embedded/jetson
    label: NVIDIA Jetson 平台
  - type: url
    uri: https://docs.ultralytics.com/guides/nvidia-jetson/
    label: YOLOv8 在 Jetson 上部署
- id: end-to-end-project
  title: 端到端 YOLO 实战项目
  description: 从数据采集、标注、训练、调优到部署的完整流程，以行人检测或交通标志识别为例。
  type: project
  difficulty: advanced
  resources:
  - type: url
    uri: https://docs.ultralytics.com/quickstart/
    label: YOLOv8 快速入门
  - type: url
    uri: https://github.com/ultralytics/ultralytics/wiki/Training-Custom-Models
    label: 训练自定义模型（Wiki）
  - type: url
    uri: https://www.kaggle.com/datasets/ultralytics/coco128
    label: COCO128 测试数据集
